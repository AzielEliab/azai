[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azai"
version = "0.2.0"
description = "AZAI: local OpenAI-compatible runtime that blends GPT, Grok, and Venice under the Lamb Lens. Jeeves is not sovereign."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Aziel Eliab"}]
requires-python = ">=3.10"
keywords = [
    "azai",
    "jeeves",
    "openai-compatible",
    "local",
    "lamb-lens",
    "gpt",
    "grok",
    "venice",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]
voice = []

[project.scripts]
azai = "azai.cli:main"

[project.urls]
Homepage = "https://github.com/AzielEliab/azai"
Download = "https://github.com/AzielEliab/azai/releases"
Issues = "https://github.com/AzielEliab/azai/issues"
Counted-downloads = "https://azai-download-tracker.vibelock.workers.dev/"

[tool.setuptools.packages.find]
include = ["azai*"]

[tool.setuptools.package-data]
azai = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
